# Serves the built app, and does what the Vite dev proxy does in development:
# Option A: proxy CopilotKit calls to the Node runtime (same origin, so no CORS setup).
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /api/copilotkit {
    proxy_pass http://copilot-runtime:4000;
    proxy_http_version 1.1;
    proxy_buffering off;        # stream Server-Sent Events as they arrive
    proxy_read_timeout 600s;    # agent runs can take a while
  }
}
