# Serves the built app, and does what the Vite dev proxy does in development:
# Option B: proxy the AG-UI stream to the orchestrator (same origin, so no CORS setup).
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /agui {
    proxy_pass http://orchestrator:8003;
    proxy_http_version 1.1;
    proxy_buffering off;        # stream Server-Sent Events as they arrive
    proxy_read_timeout 600s;    # agent runs can take a while
  }
}
